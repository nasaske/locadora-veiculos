name: Build .NET

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LocadoraVeiculos.sln

      - name: Build
        run: dotnet build LocadoraVeiculos.sln --configuration Release --no-restore

      - name: Package source
        run: |
          zip -qr locadora-veiculos-etapa2.zip . -x '.git/*' 'src/LocadoraVeiculos/bin/*' 'src/LocadoraVeiculos/obj/*'

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: locadora-veiculos-etapa2
          path: locadora-veiculos-etapa2.zip
          if-no-files-found: error
