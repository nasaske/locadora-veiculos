name: Build e Testes .NET

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LocadoraVeiculos.sln

      - name: Build
        run: dotnet build LocadoraVeiculos.sln --configuration Release --no-restore

      - name: Testes automatizados
        run: >
          dotnet test LocadoraVeiculos.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=etapa3.trx"
          --results-directory TestResults

      - name: Evidências dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-testes-etapa3
          path: TestResults/**
          if-no-files-found: warn
